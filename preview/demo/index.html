<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390px preview</title>
<style>
  body{margin:0;background:#2b2333;font-family:sans-serif;color:#d9d2e4}
  .bar{padding:10px 14px;font-size:12px;letter-spacing:.04em}
  iframe{display:block;width:390px;height:900px;border:0;background:#fff;margin:0 auto}
</style></head>
<body>
<div class="bar">390px preview（見え方テスト：当選・発送・今日発表／実際の当選ではありません）</div>
<iframe id="f" src="frame.html"></iframe>
<script>
var q = new URLSearchParams(location.search);
var f = document.getElementById('f');
f.addEventListener('load', function () {
  setTimeout(function () {
    try {
      if (q.get('sort') === 'near') f.contentDocument.querySelector('.sortbtn[data-sort="near"]').click();
      if (q.get('cat')) {
        var c = f.contentDocument.querySelector('.chip[data-cat="' + q.get('cat') + '"]');
        if (c) c.click();
      }
    } catch (e) {}
    f.contentWindow.scrollTo(0, +(q.get('y') || 0));
  }, 700);
});
</script>
</body></html>
